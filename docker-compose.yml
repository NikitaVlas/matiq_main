services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matiq
      POSTGRES_USER: matiq
      POSTGRES_PASSWORD: matiq_local
    ports:
      - '5432:5432'
    volumes:
      - matiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matiq -d matiq']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - matiq_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: matiq
      MINIO_ROOT_PASSWORD: matiq-local-only
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - matiq_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matiq_postgres:
  matiq_redis:
  matiq_minio:
